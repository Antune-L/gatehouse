[package]
name = "gatehouse"
version = "0.1.0"
description = "Gatehouse — Where agents meet your data"
authors = ["Antoine"]
edition = "2021"
rust-version = "1.77"
default-run = "gatehouse"

[lib]
name = "gatehouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "column_decltype"] }
sqlparser = "0.52"
postgres = "0.19"
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native"] }
rand = "0.8"
thiserror = "2"
dirs = "5"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
zeroize = "1"
rmcp = { version = "2.2.0", features = ["server", "transport-async-rw"] }
russh = "0.62"
tokio = { version = "1.53.0", features = ["net", "io-util", "rt", "rt-multi-thread", "time", "macros", "sync"] }
schemars = "1.2.1"
libc = "0.2.186"
mysql = "28.0.0"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
postgres-native-tls = "0.5.1"
native-tls = "0.2.13"
chrono = "0.4.45"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
